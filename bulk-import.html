  /* ================= SINGLE-PLAYLIST SECTIONS ================= */
  const SINGLE_SECTIONS = ["মাসআলা", "প্রচলিত ভুল", "মাসনুন আমল", "কুরআনের শিক্ষা"];

  async function startImport() {
    document.getElementById('startBtn').disabled = true;
    document.getElementById('log').textContent = '';
    try {
      log('Fetching existing data...');
      const [hgSnap, qgSnap, plSnap] = await Promise.all([
        db.collection('hadithGroups').get(),
        db.collection('quranGroups').get(),
        db.collection('playlists').get()
      ]);

      const existingHadithGroups = {};
      hgSnap.forEach(d => existingHadithGroups[d.data().name] = d.id);
      const existingQuranGroups = {};
      qgSnap.forEach(d => existingQuranGroups[d.data().name] = d.id);

      const byHadith = {}, byQuran = {}, bySection = {};
      plSnap.forEach(doc => {
        const d = doc.data();
        if (d.hadithGroupId) byHadith[d.hadithGroupId + '||' + d.name] = doc.id;
        else if (d.quranGroupId) byQuran[d.quranGroupId + '||' + d.name] = doc.id;
        else if (d.section) bySection[d.section + '||' + d.name] = doc.id;
      });

      log('Found ' + hgSnap.size + ' hadith groups, ' + qgSnap.size + ' quran groups, ' + plSnap.size + ' playlists already in database.\n');

      // ---- Al Hadith ----
      for (let gi = 0; gi < HADITH_DATA.length; gi++) {
        const g = HADITH_DATA[gi];
        let groupId = existingHadithGroups[g.name];
        const groupData = { name: g.name, badge: String(gi + 1), color: colorFor(gi), order: gi + 1 };
        if (!groupId) groupData.author = ''; 
        if (!groupId) groupData.count = 0;
        if (groupId) {
          await db.collection('hadithGroups').doc(groupId).set(groupData, { merge: true });
        } else {
          const ref = await db.collection('hadithGroups').add(Object.assign({ author: '', count: 0 }, groupData));
          groupId = ref.id;
        }
        for (let pi = 0; pi < g.playlists.length; pi++) {
          const pname = g.playlists[pi];
          const key = groupId + '||' + pname;
          const plData = { name: pname, section: null, hadithGroupId: groupId, quranGroupId: null, order: pi + 1, chapterNum: String(pi + 1), rangeStart: '', rangeEnd: '' };
          const existingId = byHadith[key];
          if (existingId) await db.collection('playlists').doc(existingId).set(plData, { merge: true });
          else await db.collection('playlists').add(plData);
        }
        log('[Al Hadith] ' + g.name + ' — ' + g.playlists.length + ' playlists done');
      }

      // ---- বিষয়ভিত্তিক কুরআন ----
      for (let gi = 0; gi < QURAN_DATA.length; gi++) {
        const g = QURAN_DATA[gi];
        let groupId = existingQuranGroups[g.name];
        const groupData = { name: g.name, color: colorFor(gi), order: gi + 1 };
        if (groupId) {
          await db.collection('quranGroups').doc(groupId).set(groupData, { merge: true });
        } else {
          const ref = await db.collection('quranGroups').add(groupData);
          groupId = ref.id;
        }
        for (let pi = 0; pi < g.playlists.length; pi++) {
          const pname = g.playlists[pi];
          const key = groupId + '||' + pname;
          const plData = { name: pname, section: null, hadithGroupId: null, quranGroupId: groupId, order: pi + 1, verseCount: '' };
          const existingId = byQuran[key];
          if (existingId) await db.collection('playlists').doc(existingId).set(plData, { merge: true });
          else await db.collection('playlists').add(plData);
        }
        log('[বিষয়ভিত্তিক কুরআন] ' + g.name + ' — ' + g.playlists.length + ' playlists done');
      }

      // ---- Section-based standalone playlists ----
      for (const sectionName in SECTION_PLAYLISTS) {
        const list = SECTION_PLAYLISTS[sectionName];
        for (let i = 0; i < list.length; i++) {
          const pname = list[i];
          const key = sectionName + '||' + pname;
          const plData = { name: pname, section: sectionName, hadithGroupId: null, quranGroupId: null, order: i + 1 };
          const existingId = bySection[key];
          if (existingId) await db.collection('playlists').doc(existingId).set(plData, { merge: true });
          else await db.collection('playlists').add(plData);
        }
        log('[Section] ' + sectionName + ' — ' + list.length + ' playlists done');
      }

      // ---- Single-playlist sections ----
      for (const sec of SINGLE_SECTIONS) {
        const key = sec + '||' + sec;
        const plData = { name: sec, section: sec, hadithGroupId: null, quranGroupId: null, order: 0 };
        const existingId = bySection[key];
        if (existingId) await db.collection('playlists').doc(existingId).set(plData, { merge: true });
        else await db.collection('playlists').add(plData);
        log('[Single Section] ' + sec + ' done');
      }

      log('\n✅ সব কিছু সম্পন্ন হয়েছে! এখন admin.html বা index.html খুলে দেখতে পারো।');
    } catch (err) {
      log('\n❌ ERROR: ' + err.message);
    }
    document.getElementById('startBtn').disabled = false;
  }
</script>
</body>
</html>
